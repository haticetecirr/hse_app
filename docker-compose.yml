services:
  postgres:
    image: postgres:16-alpine
    container_name: hse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hse
      POSTGRES_PASSWORD: hse_password
      POSTGRES_DB: hse_db
    ports:
      # Host 5433 -> konteyner 5432 (5432'de yerel bir PostgreSQL olabilir diye)
      - "5433:5432"
    volumes:
      - hse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hse -d hse_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # pgAdmin - web tabanli DB yonetim arayuzu: http://localhost:5050
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: hse_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@hse.com
      PGADMIN_DEFAULT_PASSWORD: admin
      # Tek kullanicili mod (her acilista login istemez)
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - hse_pgadmin:/var/lib/pgadmin
      # Uygulama DB baglantisini onceden tanimli getir
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  # MinIO - S3 uyumlu nesne depolama (yuklenen foto/videolar burada tutulur)
  minio:
    image: minio/minio:latest
    container_name: hse_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hse_minio
      MINIO_ROOT_PASSWORD: hse_minio_password
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web konsol: http://localhost:9001
    volumes:
      - hse_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hse_pgdata:
  hse_pgadmin:
  hse_minio:
